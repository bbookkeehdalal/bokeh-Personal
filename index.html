  <style>
    body { box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 2px; }

    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-body { font-family: 'Inter', -apple-system, sans-serif; }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  opacity: 1;
}

/* Soft cinematic haze behind logo */
.logo-glow::before {
  content: "";
  position: absolute;
  width: 520px;
  height: 520px;
  left: 50%;
  top: 39%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle, rgba(0, 0, 0, 0.10) 0%, rgba(0, 0, 0, 0.045) 32%, transparent 68%),
    radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.20) 18%, transparent 42%);
  filter: blur(30px);
  opacity: 0;
  animation: centerHaze 3s ease-out forwards;
}

/* Elegant moving glare line */
.logo-glow::after {
  content: "";
  position: absolute;
  width: 42%;
  height: 170%;
  left: -45%;
  top: -35%;
  transform: rotate(24deg);
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(0, 0, 0, 0.00) 32%,
    rgba(0, 0, 0, 0.06) 42%,
    rgba(255, 255, 255, 1) 50%,
    rgba(0, 0, 0, 0.06) 58%,
    rgba(0, 0, 0, 0.00) 68%,
    transparent 100%
  );
  filter: blur(12px);
  opacity: 0;
  mix-blend-mode: multiply;
  animation: luxurySweep 3s ease-out forwards;
}


    .logo-glow .logo-spark {
  position: absolute;
  width: 150px;
  height: 150px;
  left: 38%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.32) 18%, rgba(0,0,0,0.08) 42%, transparent 72%);
  filter: blur(10px);
  opacity: 0;
  mix-blend-mode: screen;
  animation: logoSpark 3s ease-out forwards;
}

@keyframes logoSpark {
  0%, 32% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.65);
  }

  45% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }

  65% {
    opacity: 0.65;
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.35);
  }
}
    
.bokeh-glare {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  mix-blend-mode: multiply;
  transform: translate(-50%, -50%) scale(0.75);
  animation: glareFloat 3s ease-out forwards;
}

.bokeh-glare:nth-child(1) {
  width: 180px;
  height: 180px;
  filter: blur(28px);
  background: radial-gradient(circle, rgba(0, 0, 0, 0.10) 0%, rgba(0, 0, 0, 0.04) 40%, transparent 74%);
  top: 37%;
  left: 43%;
  animation-delay: 0.05s;
}

.bokeh-glare:nth-child(2) {
  width: 130px;
  height: 130px;
  filter: blur(22px);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(0, 0, 0, 0.035) 42%, transparent 74%);
  top: 42%;
  left: 54%;
  animation-delay: 0.14s;
}

.bokeh-glare:nth-child(3) {
  width: 220px;
  height: 220px;
  filter: blur(36px);
  background: radial-gradient(circle, rgba(0, 0, 0, 0.075) 0%, rgba(0, 0, 0, 0.03) 42%, transparent 76%);
  top: 32%;
  left: 50%;
  animation-delay: 0.23s;
}

.bokeh-glare:nth-child(4) {
  width: 90px;
  height: 90px;
  filter: blur(18px);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(0, 0, 0, 0.025) 45%, transparent 72%);
  top: 31%;
  left: 59%;
  animation-delay: 0.32s;
}


@keyframes glareFloat {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.65) translateY(18px);
  }

  28% {
    opacity: 1;
  }

  62% {
    opacity: 0.8;
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.22) translateY(-18px);
  }
}

@keyframes centerHaze {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.7);
  }

  35% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.25);
  }
}

@keyframes luxurySweep {
  0% {
    left: -45%;
    opacity: 0;
  }

  28% {
    opacity: 1;
  }

  100% {
    left: 115%;
    opacity: 0;
  }
}


    .logo-pulse {
      animation: logoPulse 2s ease-in-out infinite;
    }

    @keyframes logoPulse { 0%, 100% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.3)); } 50% { filter: drop-shadow(0 0 40px rgba(255,255,255,0.6)); } }

    #splash-logo {
  position: fixed;
  z-index: 10;
  max-width: 300px;
  width: 80%;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  animation: logoEntrance 0.9s ease-out, logoPulseLight 3s ease-in-out infinite;
  background: transparent;
  mix-blend-mode: multiply;
  will-change: top, transform, opacity;
}

    
    @keyframes logoEntrance { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes logoPulseLight {
  0%, 100% {
    filter:
      drop-shadow(0 8px 18px rgba(0, 0, 0, 0.10))
      drop-shadow(0 0 12px rgba(255, 255, 255, 0.75));
  }

  50% {
    filter:
      drop-shadow(0 10px 28px rgba(0, 0, 0, 0.18))
      drop-shadow(0 0 30px rgba(255, 255, 255, 1));
  }
}

    #splash-logo.shrink-to-header {
      animation: shrinkToHeader 1.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes shrinkToHeader {
      from {
        top: 50%;
        transform: translate(-50%, -50%) scale(1);
      }

      to {
        top: 0px;
        transform: translate(-50%, -20px) scale(0.65);
        max-width: 300px;
        opacity: 1;
        visibility: visible;
      }
    }
@keyframes flareLine {
  0% {
    opacity: 0;
    transform: translateY(-50%) scaleX(0.65);
  }

  25% {
    opacity: 1;
  }

  55% {
    opacity: 0.95;
    transform: translateY(-50%) scaleX(1);
  }

  100% {
    opacity: 0;
    transform: translateY(-50%) scaleX(1.08);
  }
}
    
    #splash-logo.fade-out-splash {
      opacity: 0;
      transition: none !important;
    }

    #header-logo { position: fixed; top: 0px; left: 50%; transform: translate(-50%, -20px) scale(0.65); max-width: 300px; width: 80%; height: auto; z-index: 50; opacity: 0; mix-blend-mode: multiply; cursor: default; transition: opacity 0.5s ease; }

    #header-logo.visible {
      opacity: 1;
    }

    .filter-chip {
      transition: color 0.12s ease, opacity 0.12s ease;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      border: none !important;
      background: transparent !important;
      border-radius: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      color: rgba(0,0,0,0.48);
      position: relative;
    }

    .filter-chip:hover {
      color: #000;
    }

    .filter-chip.active {
      color: #000;
      background: transparent !important;
    }

    .filter-divider {
      color: rgba(0,0,0,0.55);
      font-size: 13px;
      line-height: 1;
      transform: translateY(-1px);
      pointer-events: none;
    }

    #filter-bar {
      transition: opacity 0.28s ease, transform 0.28s ease, max-height 0.28s ease, padding 0.28s ease;
      overflow: visible;
    }

    #filter-bar.hide-filters {
      opacity: 0;
      transform: translateY(-18px);
      pointer-events: none;
      max-height: 0;
      padding-bottom: 0 !important;
    }

    .grid-item {
      transition: opacity 0.16s ease;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .grid-item:hover video,
    .grid-item:hover img {
      filter: brightness(1.05);
    }

    .fade-in {
      opacity: 0;
      animation: fadeOnly 0.18s ease forwards;
    }

    @keyframes fadeOnly {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mosaic-grid {
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding: 7px;
      column-count: 3;
      column-gap: 7px;
    }

    .grid-sizer { display: none; }

    .grid-item {
      width: 100%;
      display: inline-block;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin: 0 0 7px;
      overflow: hidden;
      border-radius: 8px;
      background: #f8f8f5;
      box-sizing: border-box;
      cursor: pointer;
    }

    .grid-item img,
    .grid-item video {
      width: 100%;
      height: auto;
      display: block;
      background: #f8f8f5;
      border-radius: 8px;
      transition: filter 0.2s ease;
    }

    .video-poster-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      background: #f8f8f5;
    }

    .video-poster-img {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      opacity: 1;
      transition: opacity 0.28s ease;
      background: #f8f8f5;
    }

    .video-poster-wrap.video-ready .video-poster-img {
      opacity: 0;
      pointer-events: none;
    }

    .video-poster-wrap video {
      position: relative;
      z-index: 1;
    }

    .grid-item.hidden-by-filter {
      display: none;
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .mosaic-grid {
        padding: 8px;
        column-count: 8;
        column-gap: 8px;
      }

      .grid-item { margin-bottom: 8px; }
    }

    @media (min-width: 1024px) {
      .mosaic-grid {
        padding: 10px;
        column-count: 8;
        column-gap: 10px;
      }

      .grid-item { margin-bottom: 10px; }
    }

    #portfolio-grid {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #portfolio-grid.ready {
      opacity: 1;
    }

    #scroll-to-top {
      transition: opacity 0.22s ease, transform 0.22s ease;
      opacity: 0;
      pointer-events: none;
    }

    #scroll-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .contact-icon {
      transition: all 0.3s ease;
    }

    .contact-icon:hover {
      transform: scale(1.1);
      filter: brightness(0.8);
    }

    body.single-view-open {
      overflow: hidden;
    }

    .single-zoom-clone {
      position: fixed;
      z-index: 1001;
      margin: 0;
      object-fit: contain;
      border-radius: 10px;
      pointer-events: none;
      transition:
        transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.16s ease;
      box-shadow: 0 18px 70px rgba(0,0,0,0.18);
      background: #f8f8f5;
      will-change: transform, opacity;
      transform-origin: top left;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    #single-media-container {
      max-width: 92vw;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #single-media-container img,
    #single-media-container video {
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      border-radius: 10px;
      display: block;
      background: #f8f8f5;
    }

   #filter-container {
  position: relative;
}

.portfolio-redirect-wrap {
  flex-basis: 100%;
  display: flex;
  justify-content: center;
  margin-top: 6px;
}

.portfolio-redirect-link {
  color: rgba(0,0,0,0.55);
  text-decoration: none;
  position: relative;

  display: inline-flex;
  align-items: center;
  gap: 0;

  padding: 0;

.portfolio-redirect-link::after {

  width: 100%;
  height: 1px;

  transition: background 0.16s ease;

.portfolio-redirect-link:hover {
  color: #000;

.portfolio-redirect-link:hover::after {
  background: #000;

@media (min-width: 768px) {
  .portfolio-redirect-wrap {
    position: absolute;
    right: 0;
    top: 0;
    flex-basis: auto;
    display: block;
    margin-top: 0;
  }

  .portfolio-redirect-link {
    font-size: 14px;
  }
}

  </style>
</head>

    <button id="scroll-to-top" class="fixed bottom-8 right-8 z-50 w-12 h-12 md:w-14 md:h-14 rounded-full bg-black/10 border border-black/20 backdrop-blur-sm flex items-center justify-center hover:bg-black/20 hover:border-black/30 transition-all" aria-label="Scroll to top">

  <script>
    const API_URL = "https://bokeh-backend-api.vercel.app";

    const defaultConfig = {
      tagline: 'Life & Travel',
      about_heading: 'About Saad',
      about_description: 'A personal visual archive by Saad Al Saad — capturing travel, life, places, and moments through a cinematic lens.',
      about_photo_url: '',
      email_address: 'saad@bokeh.com',
      phone_number: '+96599060871',
      whatsapp_number: '96599060871',
      instagram_handle: 'bokehcreates',
      instagram_url: 'https://instagram.com/bokehcreates',
      logo_url: './assets/logo2.png'
    };

    let portfolioItems = [];
    let shuffledPortfolioItems = [];
    let categories = [];

    let currentFilter = 'all';
    let singleViewOriginEl = null;
    let singleViewCurrentItem = null;
    let singleViewScrollY = 0;
    let videoReminderInterval = null;

    function shuffleOnce(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function normalizeAspectRatio(value, fallback = null) {
      if (!value) return fallback;

      const clean = String(value).trim();

      if (/^\d+(\.\d+)?\s*\/\s*\d+(\.\d+)?$/.test(clean)) {
        return clean.replace("/", " / ");
      }

      const numberValue = Number(clean);

      if (!Number.isNaN(numberValue) && numberValue > 0) {
        return `${numberValue} / 1`;
      }

      return fallback;
    }

    function lockBodyScroll() {
      singleViewScrollY = window.scrollY || window.pageYOffset;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${singleViewScrollY}px`;
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
      document.body.classList.add('single-view-open');
    }

    function unlockBodyScroll() {
      document.body.classList.remove('single-view-open');
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, singleViewScrollY);
    }

    function getCenteredFitRect(originRect, mediaType = 'image') {
      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;
      const maxW = viewportW * 0.92;
      const maxH = viewportH * 0.88;

      let targetW = maxW;
      let targetH = mediaType === 'video' ? maxW * (9 / 16) : maxH;

      if (targetH > maxH) {
        targetH = maxH;
        if (mediaType === 'video') targetW = targetH * (16 / 9);
      }

      return {
        top: (viewportH - targetH) / 2,
        left: (viewportW - targetW) / 2,
        width: targetW,
        height: targetH
      };
    }

    function setCloneRectAndTransform(clone, fromRect, toRect) {
      clone.style.top = `${fromRect.top}px`;
      clone.style.left = `${fromRect.left}px`;
      clone.style.width = `${fromRect.width}px`;
      clone.style.height = `${fromRect.height}px`;
      clone.style.transform = 'translate3d(0,0,0) scale(1,1)';

      requestAnimationFrame(() => {
        const dx = toRect.left - fromRect.left;
        const dy = toRect.top - fromRect.top;
        const sx = toRect.width / fromRect.width;
        const sy = toRect.height / fromRect.height;
        clone.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sx}, ${sy})`;
      });
    }

    function forceStartVideo(video) {
      if (!video) return;

      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.autoplay = true;
      video.setAttribute('muted', '');
      video.setAttribute('loop', '');
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.preload = 'metadata';

      video.play().catch(() => {});
    }

    function markVideoReady(video) {
      const wrap = video.closest('.video-poster-wrap');
      if (wrap) wrap.classList.add('video-ready');
    }

    function hydrateGridVideo(video) {
      if (!video) return Promise.resolve();

      const realSrc = video.dataset.realSrc;

      if (realSrc && !video.src) {
        video.src = realSrc;
        video.load();
      }

      forceStartVideo(video);

      return new Promise((resolve) => {
        const markReady = () => {
          markVideoReady(video);
          resolve();
        };

        if (video.readyState >= 2 && !video.paused) {
          markReady();
          return;
        }

        video.addEventListener('playing', markReady, { once: true });
        video.addEventListener('timeupdate', markReady, { once: true });
        video.addEventListener('canplay', () => forceStartVideo(video), { once: true });

        setTimeout(resolve, 2500);
      });
    }

    async function loadGridVideosProgressively(batchSize = 2) {
      const videos = Array.from(
        document.querySelectorAll('#portfolio-grid video[data-autoplay="true"]')
      );

      for (let i = 0; i < videos.length; i += batchSize) {
        const batch = videos.slice(i, i + batchSize);

        await Promise.all(batch.map(video => hydrateGridVideo(video)));

        await new Promise(resolve => setTimeout(resolve, 120));
      }
    }

    function startAllGridVideos() {
      if (document.hidden) return;

      document.querySelectorAll('#portfolio-grid video[data-autoplay="true"]').forEach(video => {
        if (video.dataset.realSrc && !video.src) {
          video.src = video.dataset.realSrc;
          video.load();
        }

        if (video.paused || video.ended || video.readyState < 2) {
          forceStartVideo(video);
        } else {
          markVideoReady(video);
        }
      });
    }

    function startVideoReminder() {
      if (videoReminderInterval) {
        clearInterval(videoReminderInterval);
      }

      videoReminderInterval = setInterval(() => {
        if (document.hidden) return;

        const videos = document.querySelectorAll('#portfolio-grid video[data-autoplay="true"]');

        if (!videos.length) return;

        videos.forEach(video => {
          if (video.dataset.realSrc && !video.src) {
            video.src = video.dataset.realSrc;
            video.load();
          }

          if (video.paused || video.ended || video.readyState < 2) {
            forceStartVideo(video);
          } else {
            markVideoReady(video);
          }
        });
      }, 4000);
    }

    async function loadBackendData() {
      const [portfolioRes, categoriesRes] = await Promise.all([
        fetch(`${API_URL}/api/personal/portfolio`),
        fetch(`${API_URL}/api/personal/categories`)
      ]);

      if (!portfolioRes.ok) throw new Error("Failed loading personal portfolio");
      if (!categoriesRes.ok) throw new Error("Failed loading personal categories");

      const portfolioRaw = await portfolioRes.json();
      const categoriesRaw = await categoriesRes.json();

      categories = (categoriesRaw || []).map(cat => ({
        label: cat.label,
        slug: cat.slug
      }));

      portfolioItems = (portfolioRaw || []).map(m => {
        const itemType = m.type;
        const ratio = normalizeAspectRatio(m.aspect_ratio || m.aspectRatio || null);

        return {
          id: m.item_id,
          type: itemType,
          category: m.category || null,
          src: m.src,
          gridSrc: m.gridSrc || m.grid_src || null,
          previewSrc: m.previewSrc || m.preview_src || null,
          posterSrc: m.posterSrc || m.poster_src || null,
          hideFromAll: Boolean(m.hideFromAll),
          aspectRatio: ratio
        };
      });

      shuffledPortfolioItems = shuffleOnce(portfolioItems);
    }

    function initSplashScreen() {
  const splashScreen = document.getElementById('splash-screen');
  const splashLogo = document.getElementById('splash-logo');
  const headerLogo = document.getElementById('header-logo');
  const mainContent = document.getElementById('main-content');
  const logoGlow = document.getElementById('logo-glow');

  // Create 4 elegant bokeh circles
  for (let i = 0; i < 4; i++) {
    const glare = document.createElement('div');
    glare.className = 'bokeh-glare';
    logoGlow.appendChild(glare);
  }
const logoSpark = document.createElement('div');
logoSpark.className = 'logo-spark';
logoGlow.appendChild(logoSpark);

  // 1.35s: logo starts moving to header
  setTimeout(() => {
    splashLogo.classList.add('shrink-to-header');
    logoGlow.style.transition = 'opacity 0.65s ease';
    logoGlow.style.opacity = '0';
  }, 1350);

  // 2.75s: header logo appears and splash fades
  setTimeout(() => {
    splashLogo.classList.add('fade-out-splash');
    headerLogo.classList.add('visible');
    splashScreen.classList.add('fade-out');
    mainContent.classList.add('visible');
  }, 2750);

  // 3.35s: remove splash from page after fade
  setTimeout(() => {
    splashScreen.style.display = 'none';
  }, 3350);
}

function renderCategoryFilters() {
  const container = document.getElementById('filter-container');

  const filterItems = [
    { label: 'All', slug: 'all' },
    ...categories.filter(cat => cat.slug).map(cat => ({
      label: cat.label,
      slug: cat.slug
    }))
  ];

  const filtersHTML = filterItems.map((cat, index) => {
    const activeClass = index === 0 ? 'active' : '';

    const button = `
      <button class="filter-chip ${activeClass} text-[11px] md:text-sm tracking-wide uppercase" data-filter="${cat.slug}">
        ${cat.label}
      </button>
    `;

    const divider = index < filterItems.length - 1
      ? `<span class="filter-divider">|</span>`
      : '';

    return button + divider;
  }).join('');

const commercialLink = `
  <div class="portfolio-redirect-wrap">
    <a href="https://bokehbysaad.com" class="portfolio-redirect-link">
      COMMERCIAL→
    </a>
  </div>
`;

  container.innerHTML = filtersHTML + commercialLink;
}

    function getGridItemsForFilter(filter) {
      return filter === 'all'
        ? shuffledPortfolioItems.filter(item => !item.hideFromAll)
        : shuffledPortfolioItems.filter(item => item.category === filter);
    }

    function getDisplaySrc(item) {
      if (item.type === 'video') return item.previewSrc || item.src;
      return item.gridSrc || item.previewSrc || item.src;
    }

    function renderPortfolioGrid(filter = 'all') {
      const grid = document.getElementById('portfolio-grid');
      grid.classList.remove('ready');

      const items = getGridItemsForFilter(filter);

      grid.innerHTML = `<div class="grid-sizer"></div>` + items.map((item, index) => {
        const delay = Math.min(index * 0.002, 0.08);
        const ratioStyle = item.aspectRatio ? `aspect-ratio:${item.aspectRatio};` : "";
        const displaySrc = getDisplaySrc(item);
        const posterSrc = item.posterSrc || item.previewSrc || '';

        if (item.type === 'video') {
          return `
            <div class="grid-item relative fade-in cursor-pointer"
              style="animation-delay:${delay}s; ${ratioStyle}"
              data-id="${item.id}"
              data-category="${item.category || ''}"
              data-hide-from-all="${item.hideFromAll ? 'true' : 'false'}"
              data-video-src="${item.src}">
              <div class="video-poster-wrap" style="${ratioStyle}">
                ${posterSrc ? `
                  <img
                    class="video-poster-img"
                    src="${posterSrc}"
                    alt=""
                    loading="${index < 8 ? 'eager' : 'lazy'}"
                    decoding="async"
                    fetchpriority="${index < 4 ? 'high' : 'auto'}"
                  />
                ` : ''}
                <video
                  class="block w-full h-auto"
                  data-real-src="${displaySrc}"
                  poster="${posterSrc}"
                  muted
                  loop
                  autoplay
                  playsinline
                  webkit-playsinline
                  preload="none"
                  data-autoplay="true"
                ></video>
              </div>
              <div class="absolute inset-0 bg-gradient-to-t from-white/10 to-transparent opacity-0 hover:opacity-100 transition-opacity"></div>
            </div>
          `;
        }

        return `
          <div class="grid-item relative fade-in cursor-pointer"
            style="animation-delay:${delay}s; ${ratioStyle}"
            data-id="${item.id}"
            data-category="${item.category || ''}"
            data-hide-from-all="${item.hideFromAll ? 'true' : 'false'}">
            <img
              class="block w-full h-auto"
              src="${displaySrc}"
              alt=""
              loading="${index < 8 ? 'eager' : 'lazy'}"
              decoding="async"
              fetchpriority="${index < 4 ? 'high' : 'auto'}"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-white/10 to-transparent opacity-0 hover:opacity-100 transition-opacity"></div>
          </div>
        `;
      }).join('');

      setupVideoExpansion();

      grid.querySelectorAll('.grid-item:not([data-video-src])').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const item = portfolioItems.find(x => String(x.id) === String(id));
          if (item) openSingleView(item, el);
        });
      });

      requestAnimationFrame(() => {
        grid.classList.add('ready');
        loadGridVideosProgressively(2);
        startVideoReminder();
      });
    }

    function filterPortfolio(filter) {
      currentFilter = filter;

      const items = document.querySelectorAll('#portfolio-grid .grid-item');

      items.forEach(el => {
        const category = el.dataset.category || '';
        const hideFromAll = el.dataset.hideFromAll === 'true';
        const shouldShow = filter === 'all' ? !hideFromAll : category === filter;

        if (shouldShow) {
          el.classList.remove('hidden-by-filter');
        } else {
          el.classList.add('hidden-by-filter');
        }
      });

      requestAnimationFrame(startAllGridVideos);
    }

    function applyFilterChipActive(chip) {
      const container = document.getElementById('filter-container');

      container.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.remove('active');
      });

      chip.classList.add('active');
    }

    function setupFilters() {
      const container = document.getElementById('filter-container');

      container.addEventListener('pointerdown', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;

        applyFilterChipActive(chip);
      }, { passive: true });

      container.addEventListener('click', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;

        const nextFilter = chip.dataset.filter;
        applyFilterChipActive(chip);

        if (nextFilter === currentFilter) return;

        filterPortfolio(nextFilter);

        const portfolioSection = document.getElementById('portfolio-section');
        window.scrollTo({
          top: Math.max(0, portfolioSection.offsetTop - 170),
          behavior: 'smooth'
        });
      });
    }

    function openSingleView(item, originEl) {
      const singleView = document.getElementById('single-view');
      const backdrop = document.getElementById('single-backdrop');
      const container = document.getElementById('single-media-container');

      singleViewOriginEl = originEl;
      singleViewCurrentItem = item;

      lockBodyScroll();

      const originRect = originEl.getBoundingClientRect();
      const targetRect = getCenteredFitRect(originRect, item.type);
      const sourceMedia = originEl.querySelector(item.type === 'video' ? 'video' : 'img');
      const clone = sourceMedia.cloneNode(true);

      clone.classList.add('single-zoom-clone');

      if (item.type === 'video') {
        if (clone.dataset && clone.dataset.realSrc && !clone.src) {
          clone.src = clone.dataset.realSrc;
        }
        forceStartVideo(clone);
      }

      singleView.classList.remove('hidden');
      backdrop.style.opacity = '0';
      container.innerHTML = '';

      document.body.appendChild(clone);

      setCloneRectAndTransform(clone, originRect, targetRect);

      requestAnimationFrame(() => {
        backdrop.style.opacity = '1';
      });

      setTimeout(() => {
        if (item.type === 'video') {
          container.innerHTML = `
            <video
              src="${item.src}"
              controls
              autoplay
              loop
              playsinline
              webkit-playsinline
            ></video>
          `;

          const realVideo = container.querySelector('video');
          realVideo.muted = false;
          realVideo.volume = 1;
          realVideo.play().catch(() => {});
        } else {
          container.innerHTML = `<img src="${item.src}" alt="" />`;
        }

        clone.remove();
      }, 250);
    }

    function closeSingleView() {
      const singleView = document.getElementById('single-view');
      const backdrop = document.getElementById('single-backdrop');
      const container = document.getElementById('single-media-container');
      const currentMedia = container.querySelector('video, img');

      if (!currentMedia || !singleViewOriginEl || !document.body.contains(singleViewOriginEl)) {
        container.innerHTML = '';
        singleView.classList.add('hidden');
        unlockBodyScroll();
        singleViewOriginEl = null;
        singleViewCurrentItem = null;
        startAllGridVideos();
        return;
      }

      const currentRect = currentMedia.getBoundingClientRect();
      const originRect = singleViewOriginEl.getBoundingClientRect();
      const clone = currentMedia.cloneNode(true);

      clone.classList.add('single-zoom-clone');

      if (clone.tagName === 'VIDEO') {
        clone.muted = true;
        clone.play().catch(() => {});
      }

      document.body.appendChild(clone);

      const realVideo = container.querySelector('video');
      if (realVideo) realVideo.pause();

      container.innerHTML = '';
      backdrop.style.opacity = '0';

      setCloneRectAndTransform(clone, currentRect, originRect);

      setTimeout(() => {
        clone.remove();
        singleView.classList.add('hidden');
        unlockBodyScroll();
        singleViewOriginEl = null;
        singleViewCurrentItem = null;
        startAllGridVideos();
      }, 250);
    }

    function setupVideoExpansion() {
      document.querySelectorAll('.grid-item[data-video-src]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = el.dataset.id;
          const item = portfolioItems.find(x => String(x.id) === String(id));
          if (item) openSingleView(item, el);
        });
      });
    }

    function smoothScrollTo(targetY) {
      window.scrollTo({
        top: Math.max(0, targetY),
        behavior: 'smooth'
      });
    }

    document.getElementById('about-scroll-btn').addEventListener('click', () => {
      const aboutSection = document.getElementById('about-section');
      smoothScrollTo(aboutSection.offsetTop - 180);
    });

    document.getElementById('contact-scroll-btn').addEventListener('click', () => {
      const contactSection = document.getElementById('contact-section');
      smoothScrollTo(contactSection.offsetTop - 80);
    });

    const scrollToTopBtn = document.getElementById('scroll-to-top');
    const filterBar = document.getElementById('filter-bar');

    let scrollTicking = false;

    window.addEventListener('scroll', () => {
      if (scrollTicking) return;

      scrollTicking = true;

      requestAnimationFrame(() => {
        if (window.pageYOffset > 500) {
          scrollToTopBtn.classList.add('visible');
        } else {
          scrollToTopBtn.classList.remove('visible');
        }

        const aboutTop = document.getElementById('about-section').getBoundingClientRect().top;

        if (aboutTop < 190) {
          filterBar.classList.add('hide-filters');
        } else {
          filterBar.classList.remove('hide-filters');
        }

        scrollTicking = false;
      });
    }, { passive: true });

    scrollToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('pageshow', () => {
      startAllGridVideos();
    });

    window.addEventListener('focus', () => {
      startAllGridVideos();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        startAllGridVideos();
      }
    });

    document.getElementById('single-view').addEventListener('click', (e) => {
      if (
        e.target.id === 'single-view' ||
        e.target.id === 'single-backdrop' ||
        e.target.id === 'single-media-stage'
      ) {
        closeSingleView();
      }
    });

    document.getElementById('single-close').addEventListener('click', closeSingleView);
    document.getElementById('header-logo').style.cursor = 'default';

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const singleView = document.getElementById('single-view');

        if (!singleView.classList.contains('hidden')) {
          closeSingleView();
        }
      }
    });

    async function loadSiteConfig() {
      try {
        const res = await fetch(`${API_URL}/api/personal/site-config`);
        if (!res.ok) throw new Error('Failed to load personal site config');
        return await res.json();
      } catch (err) {
        console.error('Site config load error:', err);
        return defaultConfig;
      }
    }

    async function onConfigChange(config) {
      const logoUrl = config.logo_url || defaultConfig.logo_url;

      document.getElementById('splash-logo').src = logoUrl;
      document.getElementById('header-logo').src = logoUrl;

      document.getElementById('tagline').textContent =
        config.tagline || defaultConfig.tagline;

      document.getElementById('about-heading').textContent =
        config.about_heading || defaultConfig.about_heading;

      document.getElementById('about-description').textContent =
        config.about_description || defaultConfig.about_description;

      const aboutPhoto = document.getElementById('about-photo');
      const aboutPhotoWrap = document.getElementById('about-photo-wrap');

      if (config.about_photo_url) {
        aboutPhoto.src = config.about_photo_url;
        aboutPhotoWrap.classList.remove('hidden');
      } else {
        aboutPhotoWrap.classList.add('hidden');
      }

      const emailAddress = config.email_address || defaultConfig.email_address;
      const phoneNumber = config.phone_number || defaultConfig.phone_number;
      const whatsappNumber = config.whatsapp_number || defaultConfig.whatsapp_number;

      const instagramUrl =
        config.instagram_url ||
        `https://instagram.com/${defaultConfig.instagram_handle}`;

      document.querySelector('a[href^="mailto:"]').href = `mailto:${emailAddress}`;
      document.querySelector('a[href^="tel:"]').href = `tel:${phoneNumber}`;
      document.querySelector('a[href^="https://wa.me"]').href = `https://wa.me/${whatsappNumber}`;
      document.querySelector('a[href^="https://instagram.com"]').href = instagramUrl;
    }

    async function init() {
      const loadingPromise = (async () => {
        try {
          const siteConfig = await loadSiteConfig();
          await onConfigChange(siteConfig);
          await loadBackendData();

          renderCategoryFilters();
          renderPortfolioGrid();
          setupFilters();
        } catch (err) {
          console.error("Backend load error:", err);

          renderCategoryFilters();
          renderPortfolioGrid();
          setupFilters();
        }
      })();

      initSplashScreen();

      await loadingPromise;
    }

    init();
  </script>
</body>
</html>
